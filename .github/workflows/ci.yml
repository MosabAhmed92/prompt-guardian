name: CI-workflow

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6   # step 1
      - uses: actions/setup-python@v5  # step 2
        with:
          python-version: '3.11'
      - name: Install dependencies   # step 3
        run: pip install -r requirements.txt -r dev-requirements.txt
      - name: Ruff checks   # step 4
        run: ruff check .
      - name: ruff format check  # step 5
        run: ruff format --check .
      - name: pytest   # step 6
        run: python -m pytest

  build-and-push:
    needs: test # run ony if tests passed
    runs-on: ubuntu-latest
    permissions:
      packages: write # GTIHUB_TOKEN scope to push to GHCR
    steps:
      - uses: actions/checkout@v6
      - name: log-in to GHCR (Github Container Reg.)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mosabahmed92/prompt-guardian:${{ github.sha }}
            ghcr.io/mosabahmed92/prompt-guardian:latest
  
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: deploying to production
        run: echo "Deploying commit ${{github.sha}} to production..."
